name: SSL - Get ACME Challenge

on:
  workflow_dispatch:

jobs:
  challenge:
    runs-on: ubuntu-latest
    steps:
      - name: Install acme.sh and request DNS challenge
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            set -x
            if [ ! -d "$HOME/.acme.sh" ]; then
              curl https://get.acme.sh | sh -s email=claude@shessogeek.com
            fi
            # This domain's CAA records only authorize pki.goog, sectigo.com, and
            # letsencrypt.org. acme.sh defaults to ZeroSSL, which CAA blocks and which
            # caused orders to hang forever in "Pending". Clear any stale ZeroSSL order
            # state and switch explicitly to the Let's Encrypt CA (which CAA allows).
            rm -rf "$HOME/.acme.sh/mudroom.chat" "$HOME/.acme.sh/mudroom.chat_ecc"
            "$HOME/.acme.sh/acme.sh" --issue --dns -d mudroom.chat -d www.mudroom.chat --keylength 2048 --server letsencrypt --yes-I-know-dns-manual-mode-enough-go-ahead-please || true
