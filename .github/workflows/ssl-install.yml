name: SSL - Complete and Install Certificate

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Renew (complete) cert and install via uapi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            set -ex
            "$HOME/.acme.sh/acme.sh" --renew --dns -d mudroom.chat --server letsencrypt --yes-I-know-dns-manual-mode-enough-go-ahead-please

            CERTDIR="$HOME/.acme.sh/mudroom.chat"
            if [ ! -d "$CERTDIR" ]; then CERTDIR="$HOME/.acme.sh/mudroom.chat_ecc"; fi
            echo "Using cert dir: $CERTDIR"
            ls -la "$CERTDIR"

            # cPanel's install_ssl documentation requires cert/key/cabundle to be
            # URI-encoded, because uapi URL-decodes parameter values internally
            # (it's designed to also be called as an HTTP GET). Raw PEM text has
            # literal "+" characters from base64, which get silently turned into
            # spaces during that decoding -- corrupting the base64 exactly as seen
            # in the "Invalid base64" errors (which happened identically for both
            # EC and RSA keys, so it was never actually a key-type issue).
            CERT_ENC="$(perl -MURI::Escape -0777 -ne 'print uri_escape($_)' "$CERTDIR/mudroom.chat.cer")"
            KEY_ENC="$(perl -MURI::Escape -0777 -ne 'print uri_escape($_)' "$CERTDIR/mudroom.chat.key")"
            CAB_ENC="$(perl -MURI::Escape -0777 -ne 'print uri_escape($_)' "$CERTDIR/ca.cer")"

            UAPI_BIN="$(command -v uapi || echo /usr/local/cpanel/bin/uapi)"
            "$UAPI_BIN" SSL install_ssl domain='mudroom.chat' cert="$CERT_ENC" key="$KEY_ENC" cabundle="$CAB_ENC"
