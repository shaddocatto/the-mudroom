name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.CPANEL_APP_PATH }}
            git pull origin main
            APP_BASENAME=$(basename ${{ secrets.CPANEL_APP_PATH }})
            source /home/${{ secrets.CPANEL_USERNAME }}/nodevenv/$APP_BASENAME/18/bin/activate
            npm ci --omit=dev
            cd web
            npm ci --include=dev
            npm run build
            cd ..
            touch tmp/restart.txt
            sleep 6
            echo "--- disk usage ---"
            df -h . 2>&1 || true
            echo "--- app dir log candidates ---"
            find . -maxdepth 2 -iname "*.log" -newer tmp/restart.txt -mmin -5 2>/dev/null
            find "$HOME/logs" -iname "*$(basename $(pwd))*" 2>/dev/null
            echo "--- stderr.log tail ---"
            tail -n 60 stderr.log 2>/dev/null || echo "no stderr.log at app root"
            echo "--- passenger log search ---"
            find "$HOME" -maxdepth 4 -iname "*passenger*log*" 2>/dev/null | while read -r f; do
              echo "=== $f ==="
              tail -n 40 "$f" 2>/dev/null
            done
