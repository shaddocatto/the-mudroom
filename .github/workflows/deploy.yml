name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          passphrase: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.CPANEL_APP_PATH }}
            git pull origin main
            APP_BASENAME=$(basename ${{ secrets.CPANEL_APP_PATH }})
            source /home/${{ secrets.CPANEL_USERNAME }}/nodevenv/$APP_BASENAME/18/bin/activate
            npm ci --omit=dev
            cd web
            npm ci
            npm run build
            cd ..
            touch tmp/restart.txt
